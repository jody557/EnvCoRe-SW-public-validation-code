name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_url:
        description: "Optional public URL of the exact 19-file EnvCoRe-SW public payload ZIP"
        required: false
        type: string

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q envcore_validation scripts tests
      - name: Run unit and negative-control tests
        run: python -m unittest discover -s tests -v

  full-release-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download requested public payload ZIP
        env:
          RELEASE_URL: ${{ inputs.release_url }}
        run: python -c "import os, urllib.request; urllib.request.urlretrieve(os.environ['RELEASE_URL'], 'EnvCoRe-SW_public_payload.zip')"
      - name: Run exact public payload validation
        run: python scripts/validate_release.py --release EnvCoRe-SW_public_payload.zip --out outputs/public_payload
      - name: Run integration test
        env:
          ENVCORE_PUBLIC_RELEASE: EnvCoRe-SW_public_payload.zip
        run: python -m unittest tests.test_current_release -v
